            /* 玻璃弹窗 */
            .glass-modal {

                background: rgba(255, 255, 255, 0.55);
                border-color: rgba(255, 255, 255, 0.45);
                -webkit-backdrop-filter: blur(24px);

            .dark .glass-modal {
                background: rgba(30, 41, 59, 0.5);

            /* 卡片玻璃效果 */

            }
            .dark .glass-card {
                background: rgba(30, 41, 59, 0.55);
                border-color: rgba(255,255,255,0.08);
            }
        }
    </style>

            <button id="openPanBtn" class="text-slate-700 dark:text-slate-100 text-center flex flex-col items-center">
                <i class="fa fa-cloud text-lg"></i>
                <span class="text-xs mt-0.5">网盘</span>
            </button>
        </div>
    </div>

    <script>
        // 主题本地存储
        const toggle = document.getElementById('themeToggle');
        if(localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)){
            document.documentElement.classList.add('dark');
        }
        toggle.onclick = ()=>{
            document.documentElement.classList.toggle('dark');
            if(document.documentElement.classList.contains('dark')){
                localStorage.setItem('theme','dark');
            }else{
                localStorage.setItem('theme','light');
            }
        }

        //网盘弹窗逻辑
        const panModal = document.getElementById('panModal');
        document.getElementById('openPanBtn').onclick = ()=>{
            panModal.classList.remove('hidden');
            panModal.classList.add('flex');
        }
        document.getElementById('closePanModal').onclick = ()=>{
            panModal.classList.add('hidden');
            panModal.classList.remove('flex');
        }
        panModal.onclick = function(e){
            if(e.target === panModal){
                panModal.classList.add('hidden');
                panModal.classList.remove('flex');
            }
        }
    </script>
